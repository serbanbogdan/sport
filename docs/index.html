<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Nutriție</title>
<meta name="theme-color" content="#F3F4F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0A0B0E" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Nutriție">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<style>
:root{
  --bg:#F3F4F7;--card:#fff;--cardhi:#E9EDF5;--line:#E1E4EA;--text:#111318;--text2:#4F5663;--text3:#8A909B;
  --green:#27A866;--orange:#E08A2E;--blue:#3D6FE0;--red:#E0443B;--purple:#7B63E8;--bar:rgba(255,255,255,.98);
  --glow1:rgba(39,168,102,.22);--glow2:rgba(61,111,224,.14);--onGreen:#fff;
}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){
  --bg:#0A0B0E;--card:#15171D;--cardhi:#1D212A;--line:#272B35;--text:#F3F5F8;--text2:#A9B0BC;--text3:#6E7582;
  --green:#6FD39B;--orange:#F2A65A;--blue:#6F9BF5;--red:#F0574E;--purple:#9B87F5;--bar:rgba(30,33,40,.98);
  --glow1:rgba(111,211,155,.16);--glow2:rgba(111,155,245,.10);--onGreen:#06210F;}}
:root[data-theme=dark]{
  --bg:#0A0B0E;--card:#15171D;--cardhi:#1D212A;--line:#272B35;--text:#F3F5F8;--text2:#A9B0BC;--text3:#6E7582;
  --green:#6FD39B;--orange:#F2A65A;--blue:#6F9BF5;--red:#F0574E;--purple:#9B87F5;--bar:rgba(30,33,40,.98);
  --glow1:rgba(111,211,155,.16);--glow2:rgba(111,155,245,.10);--onGreen:#06210F}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;transition:background .35s,color .35s}
body{min-height:100vh;min-height:100dvh}
#glow{position:fixed;inset:0 0 auto 0;height:300px;pointer-events:none;z-index:0;
  background:radial-gradient(120% 100% at 0% 0%,var(--glow1),transparent 60%),radial-gradient(100% 100% at 100% 0%,var(--glow2),transparent 60%)}
#app{position:relative;z-index:1;max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 14px) 16px calc(env(safe-area-inset-bottom) + 110px)}
h1{font-size:28px;font-weight:650;margin:6px 0 2px;letter-spacing:-.4px}
.sub{color:var(--text2);font-size:14px}
.row{display:flex;align-items:center}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:16px;margin-top:12px;transition:background .35s,border-color .35s}
.pop{opacity:0;transform:translateY(14px);animation:pop .5s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes pop{to{opacity:1;transform:none}}
.press{transition:transform .15s}.press:active{transform:scale(.96)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
/* week */
.weekbar{display:flex;align-items:center;gap:4px;margin-top:6px}
.arrow{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:var(--text2)}
.range{flex:1;text-align:center;font-weight:600;font-size:15px;color:var(--text2)}
.strip{display:flex;justify-content:space-between;margin-top:12px}
.day{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;padding:8px 0 10px;border-radius:22px;transition:background .3s}
.day.sel{background:var(--card);box-shadow:0 6px 18px rgba(0,0,0,.08);outline:1px solid var(--line)}
.day .nm{font-size:12px;color:var(--text3);font-weight:500}.day.sel .nm{color:var(--text)}
.day .dt{font-size:16px;font-weight:650}
.today{font-size:10px;color:var(--green);font-weight:700;height:12px}
/* ring */
.ring{position:relative;display:grid;place-items:center}
.ring svg{position:absolute;inset:0;transform:rotate(-90deg)}
.ring .tr{stroke:var(--line);fill:none}.ring .pg{fill:none;stroke-linecap:round;transition:stroke-dashoffset .9s cubic-bezier(.2,.8,.2,1)}
.ring .in{position:relative;text-align:center;line-height:1.1}
/* summary */
.big{font-size:44px;font-weight:700;letter-spacing:-1.5px;line-height:1}
.stats{display:flex;gap:10px;margin-top:16px}
.stat{flex:1}.stat .lb{font-size:12px;color:var(--text3);margin-bottom:5px;display:flex;justify-content:space-between}
.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;width:0;border-radius:3px;transition:width .9s cubic-bezier(.2,.8,.2,1)}
/* meal */
.sec{font-size:20px;font-weight:650;margin:20px 4px 0}
.meal{cursor:pointer}
.meal .top{display:flex;gap:14px;align-items:center}
.meal .tag{font-size:12px;font-weight:700;letter-spacing:.3px}
.meal .nm{font-size:16px;font-weight:600;margin:2px 0 4px}
.meal .ing{font-size:14px;color:var(--text2);line-height:1.45}
.heart{width:36px;height:36px;display:grid;place-items:center;flex:none;color:var(--text3);transition:color .25s}
.heart svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linejoin:round}
.heart.on{color:var(--red)}.heart.on svg{fill:currentColor;animation:beat .45s}
@keyframes beat{0%{transform:scale(.6)}60%{transform:scale(1.3)}100%{transform:scale(1)}}
.chev{margin-left:auto;color:var(--text3);transition:transform .3s}
.meal.open .chev{transform:rotate(180deg)}
.det{display:grid;grid-template-rows:0fr;transition:grid-template-rows .35s ease}
.meal.open .det{grid-template-rows:1fr}
.det>div{overflow:hidden}
.det .in{padding-top:12px;margin-top:12px;border-top:1px solid var(--line)}
.det h4{margin:0 0 6px;font-size:12px;color:var(--text3);font-weight:700;letter-spacing:.3px}
.det p{margin:0;font-size:15px;line-height:1.55}
.det ul{margin:0;padding-left:18px;font-size:15px;line-height:1.6}
.meta{display:flex;gap:14px;margin-top:10px;font-size:13px;color:var(--text2)}
.nota{margin-top:10px;font-size:13px;color:var(--text2);background:var(--cardhi);padding:10px 12px;border-radius:12px}
.link{color:var(--red);font-size:13px;font-weight:600;margin-top:10px;display:inline-block}
.small .nm{font-size:15px}
.tea .nm{font-weight:650}
/* bottom bar */
#bar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 14px);z-index:5;display:flex;gap:2px;padding:6px;border-radius:34px;background:var(--bar);border:1px solid var(--line);box-shadow:0 10px 30px rgba(0,0,0,.14);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
#bar button{width:96px;padding:9px 0;border-radius:28px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;font-weight:500;color:var(--text2);transition:background .3s,color .3s,transform .15s}
#bar button.on{background:var(--cardhi);color:var(--green)}
#bar button:active{transform:scale(.94)}
svg.ic{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
/* buttons / inputs */
.btn{background:var(--green);color:var(--onGreen);font-weight:650;border-radius:16px;padding:11px 18px;font-size:15px}
.btn.ghost{background:var(--cardhi);color:var(--text)}
input[type=text],input[type=password]{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:12px 14px;font:inherit;color:var(--text);margin-top:6px}
label{font-size:12px;color:var(--text3);font-weight:600;display:block;margin-top:12px}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--cardhi);border-radius:16px;padding:8px 8px 8px 14px;margin:4px 6px 0 0;font-size:14px;animation:pop .35s both}
.chip b{width:22px;height:22px;display:grid;place-items:center;border-radius:50%;background:var(--line);color:var(--text2);font-size:14px}
.shopi{display:flex;align-items:center;gap:12px;padding:11px 4px;border-bottom:1px solid var(--line);cursor:pointer}
.shopi:last-child{border:0}
.cb{width:24px;height:24px;border-radius:8px;border:2px solid var(--text3);display:grid;place-items:center;transition:all .25s;flex:none}
.cb svg{width:16px;height:16px;stroke:var(--onGreen);stroke-width:3;fill:none;stroke-dasharray:20;stroke-dashoffset:20;transition:stroke-dashoffset .3s}
.shopi.done .cb{background:var(--green);border-color:var(--green)}
.shopi.done .cb svg{stroke-dashoffset:0}
.shopi.done .t{color:var(--text3);text-decoration:line-through}
.shopi .q{font-size:12px;color:var(--text3)}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 100px);transform:translate(-50%,20px);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:16px;font-size:14px;opacity:0;transition:all .3s;z-index:9;pointer-events:none;max-width:90%}
.toast.show{opacity:1;transform:translate(-50%,0)}
.empty{color:var(--text2);font-size:14px}
.tabv{animation:fade .35s}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;transition-duration:.01s!important}}
</style>
</head>
<body>
<div id="glow"></div>
<div id="app"></div>
<nav id="bar"></nav>
<div class="toast" id="toast"></div>
<script>
"use strict";
const DEF={owner:"serbanbogdan",repo:"sport",branch:"nutritie"};
const LIM={kcal:1300,mese:900,gustari:300,sodiu:1000};
const ZS=["Lun","Mar","Mie","Joi","Vin"];
const MESE=[["mic_dejun","MIC DEJUN","var(--orange)"],["gustare_dimineata","GUSTARE DE DIMINEAȚĂ","var(--green)"],["pranz","PRÂNZ","var(--blue)"],["gustare_dupamasa","GUSTARE DE DUPĂ-AMIAZĂ","var(--green)"]];
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const ls={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};

/* ---------- date ---------- */
const iso=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
function mondayOf(d){const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());const w=(x.getDay()+6)%7;x.setDate(x.getDate()-w);
  if(w>=5)x.setDate(x.getDate()+7); /* sâmbătă/duminică: arată săptămâna viitoare */ return x}
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const fmt=d=>d.toLocaleDateString("ro-RO",{day:"numeric",month:"short"});

/* ---------- state ---------- */
const S={tab:"meniu",monday:mondayOf(new Date()),day:0,open:{},data:null,loading:false,err:"",excluse:ls.get("excluse",[]),fav:ls.get("fav",[]),dirty:ls.get("dirty",false)};
const cfg=()=>Object.assign({},DEF,ls.get("gh",{}),{token:ls.get("token","")});
const raw=p=>{const c=cfg();return `https://raw.githubusercontent.com/${c.owner}/${c.repo}/${c.branch}/${p}`};
const wkKey=()=>iso(S.monday);
{const t=new Date(),m=mondayOf(t),w=(t.getDay()+6)%7;S.day=w<5&&iso(m)===iso(S.monday)?w:0}

/* ---------- date de pe GitHub ---------- */
async function load(force){
  const k="menu_"+wkKey();S.err="";
  const cached=ls.get(k,null);
  if(cached&&!force){S.data=cached;render()}
  S.loading=true;
  try{
    const r=await fetch(raw("meniuri/"+wkKey()+".json")+"?t="+Date.now(),{cache:"no-store"});
    if(r.status===404){S.data=null;ls.set(k,null);if(force)toast("Nu există meniu pentru săptămâna aceasta.")}
    else if(!r.ok)throw new Error("HTTP "+r.status);
    else{S.data=await r.json();ls.set(k,S.data)}
    if(!S.dirty){try{const s=await fetch(raw("setari.json")+"?t="+Date.now(),{cache:"no-store"});if(s.ok){const j=await s.json();if(Array.isArray(j.excluse)){S.excluse=j.excluse;ls.set("excluse",S.excluse)}if(Array.isArray(j.favorite)){S.fav=j.favorite;ls.set("fav",S.fav)}}}catch(e){}}
    else pushExcluse();
    ls.set("last",Date.now());
  }catch(e){S.err=cached||S.data?"Offline — afișez ultima variantă salvată.":"Nu pot citi meniul ("+e.message+").";if(cached)S.data=cached}
  S.loading=false;render();
}
const b64=s=>btoa(unescape(encodeURIComponent(s)));
async function pushExcluse(){
  const c=cfg();if(!c.token){return false}
  const api=`https://api.github.com/repos/${c.owner}/${c.repo}/contents/setari.json`;
  const h={Authorization:"Bearer "+c.token,Accept:"application/vnd.github+json"};
  try{
    let sha;const g=await fetch(api+"?ref="+encodeURIComponent(c.branch),{headers:h});if(g.ok)sha=(await g.json()).sha;
    const body={message:"Nutritie: lista de mâncăruri excluse",branch:c.branch,content:b64(JSON.stringify({schema:"nutritie.setari",v:1,actualizat:new Date().toISOString(),excluse:S.excluse,favorite:S.fav},null,2)+"\n")};
    if(sha)body.sha=sha;
    const r=await fetch(api,{method:"PUT",headers:h,body:JSON.stringify(body)});
    if(!r.ok)throw new Error("HTTP "+r.status);
    S.dirty=false;ls.set("dirty",false);return true;
  }catch(e){toast("Nu am putut salva pe GitHub: "+e.message);return false}
}
const isFav=n=>S.fav.some(x=>x.toLowerCase()===String(n).toLowerCase());
function toggleFav(n){const on=!isFav(n);S.fav=on?[...S.fav,n]:S.fav.filter(x=>x.toLowerCase()!==n.toLowerCase());ls.set("fav",S.fav);S.dirty=true;ls.set("dirty",true);pushExcluse().then(()=>render());toast(on?"Adăugat la favorite ♥":"Scos din favorite");return on}
function setExcluse(list){S.excluse=list;S.dirty=true;ls.set("excluse",list);ls.set("dirty",true);pushExcluse().then(()=>render())}

/* ---------- ajutoare ---------- */
const meals=d=>MESE.map(m=>d&&d[m[0]]).filter(Boolean);
const kc=d=>meals(d).reduce((a,m)=>a+(m.kcal||0),0);
const na=d=>meals(d).reduce((a,m)=>a+(m.sodiu_mg||0),0);
const kcOf=(d,keys)=>keys.reduce((a,k)=>a+((d&&d[k]&&d[k].kcal)||0),0);
function ring(size,stroke,frac,color,inner,id){
  const r=(size-stroke)/2,c=2*Math.PI*r;
  return `<div class="ring" style="width:${size}px;height:${size}px"><svg width="${size}" height="${size}"><circle class="tr" cx="${size/2}" cy="${size/2}" r="${r}" stroke-width="${stroke}"/><circle class="pg" data-f="${Math.min(1,Math.max(0,frac))}" data-c="${c}" cx="${size/2}" cy="${size/2}" r="${r}" stroke-width="${stroke}" stroke="${color}" stroke-dasharray="${c}" stroke-dashoffset="${c}"/></svg><div class="in">${inner||""}</div></div>`;
}
function animate(){requestAnimationFrame(()=>requestAnimationFrame(()=>{
  document.querySelectorAll(".pg").forEach(e=>e.style.strokeDashoffset=(+e.dataset.c)*(1-(+e.dataset.f)));
  document.querySelectorAll(".bar i[data-w]").forEach(e=>e.style.width=e.dataset.w+"%");
  document.querySelectorAll(".count[data-to]").forEach(e=>{const to=+e.dataset.to,t0=performance.now();(function f(t){const p=Math.min(1,(t-t0)/800),v=Math.round(to*(1-Math.pow(1-p,3)));e.textContent=v;if(p<1)requestAnimationFrame(f)})(t0)});
}))}
function toast(t){const e=$("#toast");e.textContent=t;e.classList.add("show");clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove("show"),2600)}
const IC={
  menu:'<svg class="ic" viewBox="0 0 24 24"><path d="M7 3v7a2 2 0 0 0 2 2v9M11 3v7a2 2 0 0 1-2 2M5 3v7a2 2 0 0 0 2 2M17 21V3c-2 1-3.5 3.5-3.5 7 0 2 1 3 3.5 3z"/></svg>',
  cart:'<svg class="ic" viewBox="0 0 24 24"><circle cx="9" cy="20" r="1.5"/><circle cx="18" cy="20" r="1.5"/><path d="M3 4h2.5l2.2 11h10.6L20 7H6.5"/></svg>',
  set:'<svg class="ic" viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg>',
  chev:'<svg class="ic" viewBox="0 0 24 24" style="width:22px;height:22px"><path d="m6 9 6 6 6-6"/></svg>',
  l:'<svg class="ic" viewBox="0 0 24 24"><path d="m15 5-7 7 7 7"/></svg>',
  r:'<svg class="ic" viewBox="0 0 24 24"><path d="m9 5 7 7-7 7"/></svg>',
  share:'<svg class="ic" viewBox="0 0 24 24"><path d="M12 15V3m0 0L8 7m4-4 4 4M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-7"/></svg>',
  ref:'<svg class="ic" viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-2.3 5.7M20 4v7h-7"/></svg>',
  chk:'<svg viewBox="0 0 24 24"><path d="m5 12 5 5 9-10"/></svg>'
};

/* ---------- ecrane ---------- */
function weekBar(){return `<div class="weekbar"><button class="arrow press" data-act="prev">${IC.l}</button><div class="range">${fmt(S.monday)} – ${fmt(addDays(S.monday,4))}</div><button class="arrow press" data-act="next">${IC.r}</button></div>`}

function viewMenu(){
  const w=S.data,today=new Date(),ti=(today.getDay()+6)%7,tIso=iso(today);
  let h=`<div class="row"><div style="flex:1"><h1>Meniu</h1><div class="sub">${S.loading?"Se actualizează…":(S.err||(w?"Actualizat pe GitHub":"Nicio săptămână încărcată"))}</div></div><button class="arrow press" data-act="refresh" style="color:var(--green)">${IC.ref}</button></div>${weekBar()}`;
  if(!w){return h+`<div class="card pop empty">${S.loading?"Se încarcă…":"Nu există meniu pentru săptămâna aceasta. Rulează <b>/nutritie</b> în Claude ca să-l generezi, apoi apasă ↻."}</div>`}
  const zile=w.zile||[];
  h+=`<div class="strip">`+zile.map((z,i)=>{
    const sel=i===S.day,dt=z.data?+z.data.slice(8):addDays(S.monday,i).getDate(),isT=z.data===tIso;
    return `<button class="day press ${sel?"sel":""}" data-day="${i}"><span class="today">${isT?"AZI":""}</span>${ring(46,4,kc(z)/LIM.kcal,sel?"var(--green)":"var(--text3)",`<span class="dt">${dt}</span>`)}<span class="nm">${ZS[i]||""}</span></button>`}).join("")+`</div>`;
  const z=zile[S.day];if(!z)return h;
  const k=kc(z),s=na(z);
  const stats=[["Mese",kcOf(z,["mic_dejun","pranz"]),LIM.mese,"var(--orange)","kcal"],["Gustări",kcOf(z,["gustare_dimineata","gustare_dupamasa"]),LIM.gustari,"var(--green)","kcal"],["Sodiu",s,LIM.sodiu,s>LIM.sodiu?"var(--red)":"var(--blue)","mg"]];
  h+=`<div class="card pop" style="animation-delay:.05s"><div class="row"><div style="flex:1"><div class="big"><span class="count" data-to="${k}">0</span></div><div class="sub" style="margin-top:6px">kcal în meniul zilei</div></div>${ring(104,10,k/LIM.kcal,"var(--green)",`<div style="font-size:12px;color:var(--text3)">din</div><div style="font-weight:700">${LIM.kcal}</div>`)}</div><div class="stats">`+stats.map(a=>`<div class="stat"><div class="lb"><span>${a[0]}</span><span>${a[1]} ${a[4]}</span></div><div class="bar"><i data-w="${Math.min(100,a[1]/a[2]*100)}" style="background:${a[3]}"></i></div></div>`).join("")+`</div></div>`;
  h+=`<div class="sec">${esc(z.zi||"")} · ${S.day===ti&&iso(S.monday)===iso(mondayOf(today))?"azi":fmt(addDays(S.monday,S.day))}</div>`;
  MESE.forEach((m,i)=>{const ml=z[m[0]];if(!ml)return;h+=meal(ml,m,`${S.monday.getTime()}_${S.day}_${m[0]}`,i)});
  if(z.ceai){const t=z.ceai,id=`t_${S.day}`;const o=S.open[id];
    h+=`<div class="card meal tea pop ${o?"open":""}" data-open="${id}" style="animation-delay:.4s"><div class="top"><div style="font-size:30px">🍵</div><div style="flex:1"><div class="tag" style="color:var(--purple)">CEAI LA TERMOS</div><div class="nm">${esc(t.nume)}</div></div><span class="chev">${IC.chev}</span></div><div class="det"><div><div class="in"><h4>CUM O FACI</h4><p>${esc(t.cum)}</p><div class="nota">${esc(t.de_ce)}</div></div></div></div></div>`}
  if(w.note)h+=`<div class="card pop sub" style="animation-delay:.45s">${esc(w.note)}</div>`;
  if((w.sfaturi||[]).length)h+=`<div class="card pop" style="animation-delay:.5s"><h4 style="margin:0 0 8px;font-size:12px;color:var(--text3)">SFATURI</h4><ul style="margin:0;padding-left:18px;font-size:14px;line-height:1.55;color:var(--text2)">${w.sfaturi.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div>`;
  return h;
}
function meal(m,meta,id,i){
  const o=S.open[id],prep=(m.pregatire||"").trim(),ings=m.ingrediente||[];
  const det=prep?`<h4>MOD DE PREPARARE</h4><p>${esc(prep)}</p>`:`<h4>INGREDIENTE</h4><ul>${ings.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>`;
  const frac=Math.min(1,(m.kcal||0)/(meta[0]==="pranz"?520:meta[0]==="mic_dejun"?350:150));
  return `<div class="card meal pop ${o?"open":""} ${meta[0].startsWith("gustare")?"small":""}" data-open="${id}" style="animation-delay:${.1+i*.07}s"><div class="top">${ring(62,6,frac,meta[2],`<div style="font-weight:700;font-size:15px">${m.kcal??"–"}</div><div style="font-size:9px;color:var(--text3)">kcal</div>`)}<div style="flex:1;min-width:0"><div class="tag" style="color:${meta[2]}">${meta[1]}</div><div class="nm">${esc(m.nume)}</div><div class="ing">${o?esc(m.portie||""):esc(ings.join(" · "))}</div></div><button class="heart ${isFav(m.nume)?"on":""}" data-like="${esc(m.nume)}" aria-label="Îmi place"><svg viewBox="0 0 24 24"><path d="M12 20.5s-7.5-4.6-9-9.5C2 7.6 4 5 6.8 5c1.9 0 3.4 1 5.2 3 1.8-2 3.3-3 5.2-3C20 5 22 7.6 21 11c-1.5 4.9-9 9.5-9 9.5z"/></svg></button><span class="chev">${IC.chev}</span></div><div class="det"><div><div class="in">${det}${prep&&ings.length?`<h4 style="margin-top:12px">INGREDIENTE</h4><div class="ing">${esc(ings.join(" · "))}</div>`:""}<div class="meta"><span>🔥 ${m.kcal??"–"} kcal</span><span>🧂 ${m.sodiu_mg??"–"} mg sodiu</span>${m.portie?`<span>${esc(m.portie)}</span>`:""}</div>${m.nota?`<div class="nota">${esc(m.nota)}</div>`:""}<button class="link" data-ban="${esc(m.nume)}">Nu mai vreau asta</button></div></div></div></div>`;
}

const order=k=>({lidl:0,kaufland:1}[k.toLowerCase()]??2);
const items=()=>S.data?(S.data.cumparaturi||[]):[];
const chk=()=>ls.get("bifat_"+wkKey(),[]);
const key=p=>p.produs+"|"+p.magazin;
function shareText(){
  const done=new Set(chk()),g={};items().forEach(p=>(g[p.magazin||"Altele"]??=[]).push(p));
  let t=`Cumpărături · ${fmt(S.monday)} – ${fmt(addDays(S.monday,4))}\n`;
  Object.keys(g).sort((a,b)=>order(a)-order(b)||a.localeCompare(b)).forEach(s=>{t+=`\n${s}\n`;g[s].forEach(p=>{t+=`${done.has(key(p))?"☑":"☐"} ${p.produs}${p.cantitate?" — "+p.cantitate:""}\n`})});
  return t.trim();
}
async function share(){
  const text=shareText();
  if(navigator.share){try{await navigator.share({title:"Lista de cumpărături",text});return}catch(e){if(e.name==="AbortError")return}}
  window.open("https://wa.me/?text="+encodeURIComponent(text),"_blank");
}
function viewShop(){
  const list=items();
  let h=`<div class="row"><h1 style="flex:1">Cumpărături</h1>${list.length?`<button class="arrow press" data-act="share" style="color:var(--green)">${IC.share}</button>`:""}</div>${weekBar()}`;
  if(!list.length)return h+`<div class="card pop empty">${S.data?"Meniul acestei săptămâni nu are nimic de cumpărat.":"Nu există meniu pentru această săptămână, deci nici listă de cumpărături."}</div>`;
  const done=new Set(chk()),n=list.filter(p=>done.has(key(p))).length;
  h+=`<div class="card pop"><div class="row"><b style="flex:1;font-size:16px">${n} din ${list.length} luate</b><button class="btn press" data-act="share">Trimite lista</button></div><div class="bar" style="margin-top:12px"><i data-w="${n/list.length*100}" style="background:var(--green)"></i></div></div>`;
  const g={};list.forEach(p=>(g[p.magazin||"Altele"]??=[]).push(p));
  Object.keys(g).sort((a,b)=>order(a)-order(b)||a.localeCompare(b)).forEach((s,i)=>{
    h+=`<div class="sec">${esc(s)}</div><div class="card pop" style="padding:6px 14px;animation-delay:${.08+i*.07}s">`+g[s].map(p=>`<div class="shopi ${done.has(key(p))?"done":""}" data-chk="${esc(key(p))}"><div class="cb">${IC.chk}</div><div><div class="t">${esc(p.produs)}</div>${p.cantitate?`<div class="q">${esc(p.cantitate)}</div>`:""}</div></div>`).join("")+`</div>`});
  return h;
}
function viewSet(){
  const c=cfg();
  return `<h1>Setări</h1><div class="sub">Mâncăruri pe care nu le vrei în meniu</div>
  <div class="card pop"><div class="row" style="gap:8px"><input type="text" id="ex" placeholder="ex: ficat, pește, conopidă" style="margin:0"><button class="btn press" data-act="addex">Adaugă</button></div>
  <div style="margin-top:10px">${S.excluse.length?S.excluse.map((x,i)=>`<span class="chip">${esc(x)}<b class="press" data-rm="${i}">×</b></span>`).join(""):'<span class="empty">Lista e goală.</span>'}</div>
  ${S.dirty?`<div class="sub" style="margin-top:10px;color:var(--orange)">${c.token?"Se trimite pe GitHub…":"Salvat doar pe acest telefon — adaugă tokenul ca să ajungă și la Claude."}</div>`:""}</div>
  <h1 style="margin-top:22px;font-size:22px">Meniuri favorite ♥</h1><div class="sub">Apasă inima de lângă o masă. /nutritie le repetă mai des.</div>
  <div class="card pop" style="animation-delay:.04s">${S.fav.length?S.fav.map((x,i)=>`<span class="chip">${esc(x)}<b class="press" data-unfav="${i}">×</b></span>`).join(""):'<span class="empty">Nicio masă favorită încă.</span>'}</div>
  <div class="card pop" style="animation-delay:.08s"><b>GitHub</b><div class="sub">Meniurile se citesc fără token. Tokenul e necesar doar ca lista de excluse să ajungă la Claude.</div>
  <label>Utilizator</label><input type="text" id="g_o" value="${esc(c.owner)}" autocapitalize="off">
  <label>Repository</label><input type="text" id="g_r" value="${esc(c.repo)}" autocapitalize="off">
  <label>Ramură</label><input type="text" id="g_b" value="${esc(c.branch)}" autocapitalize="off">
  <label>Token (fine-grained, Contents: Read and write pe „sport”)</label><input type="password" id="g_t" value="${esc(c.token)}" autocomplete="off">
  <div class="row" style="gap:8px;margin-top:14px"><button class="btn press" data-act="savegh">Salvează și testează</button><button class="btn ghost press" data-act="theme">Temă: ${({light:"luminoasă",dark:"întunecată"})[ls.get("theme","")]||"automată"}</button></div></div>
  <div class="card pop sub" style="animation-delay:.16s">Cum îl pui pe iPhone: deschide pagina în Safari → Share → <b>Add to Home Screen</b>. Se va deschide ca o aplicație, cu iconița verde cu furculiță și lingură.</div>`;
}

/* ---------- randare ---------- */
function render(){
  const y=window.scrollY;
  $("#app").innerHTML=`<div class="tabv">`+({meniu:viewMenu,cump:viewShop,set:viewSet}[S.tab])()+`</div>`;
  $("#bar").innerHTML=[["meniu","Meniu",IC.menu],["cump","Cumpărături",IC.cart],["set","Setări",IC.set]].map(t=>`<button class="${S.tab===t[0]?"on":""}" data-tab="${t[0]}">${t[2]}<span>${t[1]}</span></button>`).join("");
  window.scrollTo(0,y);animate();
}
function setTheme(t){if(t)document.documentElement.dataset.theme=t;else delete document.documentElement.dataset.theme;
  const m=document.querySelectorAll('meta[name=theme-color]');}
setTheme(ls.get("theme",""));

document.addEventListener("click",async ev=>{
  const t=ev.target.closest("[data-tab],[data-day],[data-open],[data-act],[data-chk],[data-ban],[data-rm],[data-like],[data-unfav]");if(!t)return;
  const d=t.dataset;
  if(d.tab){S.tab=d.tab;window.scrollTo(0,0);if(d.tab==="cump"&&!S.data)load();return render()}
  if(d.day!=null){S.day=+d.day;return render()}
  if(d.like){ev.stopPropagation();toggleFav(d.like);return render()}
  if(d.unfav!=null){S.fav=S.fav.filter((x,i)=>i!==+d.unfav);ls.set("fav",S.fav);S.dirty=true;ls.set("dirty",true);pushExcluse().then(()=>render());return render()}
  if(d.ban){ev.stopPropagation();const n=d.ban;if(!S.excluse.some(x=>x.toLowerCase()===n.toLowerCase()))setExcluse([...S.excluse,n]);toast("„"+n+"” a intrat în lista de excluse. Cere-i lui Claude să refacă masa.");return render()}
  if(d.open){S.open[d.open]=!S.open[d.open];const el=t;el.classList.toggle("open",!!S.open[d.open]);
    const ing=el.querySelector(".top .ing");return}
  if(d.chk){const a=new Set(chk());a.has(d.chk)?a.delete(d.chk):a.add(d.chk);ls.set("bifat_"+wkKey(),[...a]);return render()}
  if(d.rm!=null){const a=[...S.excluse];a.splice(+d.rm,1);return setExcluse(a),render()}
  switch(d.act){
    case"prev":case"next":S.monday=addDays(S.monday,d.act==="next"?7:-7);S.day=0;S.data=ls.get("menu_"+wkKey(),null);render();return load();
    case"refresh":return load(true);
    case"share":return share();
    case"addex":{const i=$("#ex"),v=i.value.trim();if(v&&!S.excluse.some(x=>x.toLowerCase()===v.toLowerCase()))setExcluse([...S.excluse,v]);i.value="";return render()}
    case"theme":{const n={"":"light",light:"dark",dark:""}[ls.get("theme","")];ls.set("theme",n);setTheme(n);return render()}
    case"savegh":{ls.set("gh",{owner:$("#g_o").value.trim()||DEF.owner,repo:$("#g_r").value.trim()||DEF.repo,branch:$("#g_b").value.trim()||DEF.branch});ls.set("token",$("#g_t").value.trim());
      toast("Se testează…");await load(true);if(cfg().token&&S.dirty){await pushExcluse();}toast(S.err?S.err:"Conexiune OK");return render()}
  }
});
document.addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.id==="ex")document.querySelector('[data-act=addex]').click()});
matchMedia("(prefers-color-scheme: dark)").addEventListener?.("change",()=>render()); /* tema se schimbă live cu sistemul */
document.addEventListener("visibilitychange",()=>{if(!document.hidden&&Date.now()-ls.get("last",0)>10*60e3)load()});
if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
render();load();
</script>
</body>
</html>
